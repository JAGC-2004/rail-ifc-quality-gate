[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-ifc-quality-gate"
version = "1.0.1"
description = "Tool-independent computable quality metrics and integrated publish/hold gate for rail IFC deliverables."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE-MIT.txt"}
authors = [
  {name = "rail-ifc-quality-gate contributors"},
]
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
ifc = [
  "ifcopenshell>=0.7.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]

[project.scripts]
rail-ifc-quality-gate = "rail_ifc_quality_gate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
