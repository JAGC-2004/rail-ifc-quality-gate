name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install dev tools first so lint/tests can run even if IFC backend is unavailable
          python -m pip install -e ".[dev]"
          # Optional IFC backend (best-effort)
          python -m pip install ifcopenshell || echo "WARNING: ifcopenshell not available; IFC-dependent tests will be skipped."

      - name: Lint (ruff)
        run: |
          python -m ruff check src tests

      - name: Tests (pytest)
        run: |
          python -m pytest -q

